name: CI/CD

# Verificar en cualquier rama y en cada pull request; desplegar SOLO al empujar
# a main. Que el disparador sea el mismo workflow es deliberado: así es
# imposible que se despliegue algo que no haya pasado por la verificación.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# OIDC: el token que GitHub firma para que AWS nos dé credenciales temporales.
# `contents: read` es todo lo demás que necesitamos.
permissions:
  contents: read
  id-token: write

# Un despliegue a la vez. Sin esto, dos merges seguidos lanzan dos `cdk deploy`
# en paralelo sobre el mismo stack y CloudFormation rechaza el segundo con un
# error que parece un fallo del pipeline y no lo es.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK: DocFlow-Dev

jobs:
  # ─────────────────────────────────────────────────────────────────────
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docflow/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos de services
        run: npx tsc --noEmit -p services/tsconfig.json

      - name: Tipos de infra
        run: npx tsc --noEmit -p infra/tsconfig.json

      # Los tests del motor de reglas son deterministas y no llaman a AWS ni al
      # modelo: se pueden correr en cada push sin pensar en la factura. Es la
      # parte del sistema cuyos bugs son bugs de decisión de negocio.
      - name: Tests del motor de reglas
        run: node --test --experimental-strip-types services/test/*.test.ts

      # CLAUDE.md §2.9: bloqueante. Las librerias de parseo de PDF e imagen son
      # historicamente el peor barrio del ecosistema, y este sistema las tocara.
      - name: Vulnerabilidades en dependencias
        run: npm audit --audit-level=high

      # `cdk synth` va ANTES de la auditoria a proposito: la auditoria
      # inspecciona la PLANTILLA SINTETIZADA, no el codigo fuente. Un grep sobre
      # CDK comprueba lo que quisiste escribir; la plantilla, lo que sale.
      - name: Sintetizar la infraestructura
        working-directory: docflow/infra
        run: npx cdk synth --quiet

      # CLAUDE.md §1 y §6: los 12 invariantes, mas la promesa de eliminabilidad.
      # El script falla si no puede comprobar algo: no aprueba lo que no ha visto.
      - name: Auditoria de seguridad (CLAUDE.md)
        run: ./scripts/auditoria-seguridad.sh

  # ─────────────────────────────────────────────────────────────────────
  desplegar:
    name: Desplegar
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: produccion
    defaults:
      run:
        working-directory: docflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docflow/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Credenciales temporales de una hora. Cero claves estáticas guardadas en
      # el repositorio: el secreto es el ARN de un rol, que no sirve de nada sin
      # un token firmado por GitHub para ESTE repositorio y ESTA rama.
      # Diagnóstico: imprime los claims PÚBLICOS del token que emite GitHub.
      # Nunca el token — solo `sub`, `aud`, `repository`, `ref` y `environment`,
      # que son precisamente los valores contra los que la política de confianza
      # de IAM compara. Cuando AssumeRoleWithWebIdentity falla, el error de AWS
      # no dice QUÉ claim no cuadró; esto sí.
      - name: Diagnóstico de los claims OIDC
        env:
          AUD: sts.amazonaws.com
        run: |
          RESPUESTA=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}")
          export JWT=$(printf '%s' "$RESPUESTA" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 - <<'PY'
          import base64, json, os
          carga = os.environ["JWT"].split(".")[1]
          carga += "=" * (-len(carga) % 4)
          c = json.loads(base64.urlsafe_b64decode(carga))
          print("=" * 60)
          for k in ("sub", "aud", "repository", "repository_owner", "ref", "environment", "workflow"):
              print(f"  {k:18s}: {c.get(k)}")
          print("=" * 60)
          PY

      # El ARN del rol va LITERAL, no en un secreto. No es un descuido:
      #
      # Un ARN es un identificador, no una credencial. No sirve de nada sin un
      # token firmado por GitHub para este repositorio, que es lo que la
      # política de confianza exige. Guardarlo como secreto no añade seguridad
      # —la seguridad está en la política— y sí añade un modo de fallo: si el
      # valor se pega mal, con un espacio o con el prefijo "RoleArn = ", STS
      # responde "Not authorized to perform sts:AssumeRoleWithWebIdentity", que
      # es EXACTAMENTE el mismo error que si el rol te denegara. AWS no
      # distingue "no existe" de "no te deja" para no permitir enumerar roles.
      #
      # Es decir: el secreto convertía un error de tipografía en un error que
      # parece de permisos. Con el ARN a la vista, ese modo de fallo desaparece.
      - name: Credenciales de AWS vía OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::500645089903:role/maya-fact-github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Desplegar la infraestructura
        working-directory: docflow/infra
        run: npx cdk deploy ${{ env.STACK }} --require-approval never

      - name: Compilar y publicar la SPA
        run: ./scripts/desplegar-web.sh

      # Comprobación posterior: que la aplicación responde y que el rewrite de
      # /api sigue llegando a la API. Un 404 aquí significaría que el prefijo se
      # rompió — el fallo más fácil de introducir en esta arquitectura.
      - name: Verificar el despliegue
        run: |
          CDN=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CdnUrl'].OutputValue" --output text)
          echo "Comprobando $CDN"

          test "$(curl -s -o /dev/null -w '%{http_code}' "$CDN/")" = "200" \
            || { echo "La SPA no responde"; exit 1; }

          # Sin token debe responder 401 (llega a la API y el authorizer
          # rechaza). Un 404 significaria que el rewrite de /api no funciona.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' "$CDN/api/documents")
          test "$CODIGO" = "401" \
            || { echo "El rewrite de /api esta roto: se esperaba 401 y llego $CODIGO"; exit 1; }

          echo "Despliegue verificado: SPA y rewrite de /api correctos"
